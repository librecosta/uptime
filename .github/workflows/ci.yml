name: CI

on:
  pull_request:
    branches: [pre-master, master]
  push:
    branches:
      - develop
      - pre-master
      - master

permissions:
  contents: read

jobs:
  check:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
        include:
          - go: '1.26.x'
            toolchain: '>=1.26.10 <1.27.0'
          - go: '1.27.x'
            toolchain: '>=1.27.3 <1.28.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.toolchain }}
          check-latest: true
      - run: make check

  bbolt-race:
    name: bbolt and runtime race (Go 1.27.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.3 <1.28.0'
          check-latest: true
      - run: make race

  redis-integration:
    name: Redis integration (Go 1.27.x)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UPTIME_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.3 <1.28.0'
          check-latest: true
      - run: go test ./internal/app/... -run '^TestRedisIntegration' -count=1
