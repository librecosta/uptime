# Validate without starting a runtime:
#   uptime config check --config configs/uptime.example.yaml
# Filesystem paths are relative to the process working directory, not this file.
server:
  # Loopback by default. Set ":18580" explicitly for public/Docker/proxy access.
  address: "127.0.0.1:18580"
  shutdown_timeout: 10s
  tls:
    # When enabled: HTTPS only, static matching cert/key, TLS 1.2 minimum.
    enabled: false
    cert_file: "${UPTIME_TLS_CERT}"
    key_file: "${UPTIME_TLS_KEY}"

storage:
  type: bbolt
  bbolt:
    path: ./data/uptime.db
  redis:
    url: "${UPTIME_REDIS_URL}"
    key_prefix: fiber:uptime

auth:
  # Protects the UI/API namespace; health stays public. Use TLS or a trusted TLS proxy.
  enabled: false
  basic:
    username: "${UPTIME_AUTH_USERNAME}"
    # bcrypt ($2a$/$2b$/$2y$); hash NFC-normalized bytes for non-ASCII passwords.
    password_hash: "${UPTIME_AUTH_PASSWORD_HASH}"

uptime:
  interval: 10s
  retention: 90d
  window: 30d
  timezone: UTC

ui:
  path: /uptime
  title: Service Status
  description: Current service availability.
  footer: Powered by LibreCosta Uptime.
  favicon_url: ""
  thresholds:
    green: 0.999
    yellow: 0.99

endpoints:
  - id: website
    name: Website
    description: Example website
    url: https://example.com/
    method: GET
    interval: 30s
    timeout: 5s
    # An empty/omitted expected_status_codes list accepts 2xx/3xx.
    expected_status_codes: []
    # Only enable this header when UPTIME_API_TOKEN is set:
    # headers:
    #   Authorization: "Bearer ${UPTIME_API_TOKEN}"
